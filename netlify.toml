# Static HTML/CSS site — no build step required.
# The only server-side code is the chat assistant function in netlify/functions/chat
# (served at /api/chat). Its Anthropic API key is set in Netlify's environment
# variables (ANTHROPIC_API_KEY), never in this repository.
[build]
  publish = "."

# Keep internal links exactly as written (/page.html). Netlify's Pretty URLs
# post-processing rewrote them to /page, which _redirects then 301s back to
# /page.html, so every internal link cost a redirect hop.
[build.processing.html]
  pretty_urls = false

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The site publishes the repository root, so keep source/tooling folders from being
# served as public files. (Rules in _redirects run first; none of them match these paths.)
[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404"
  status = 404
  force = true

[[headers]]
  for = "/chat-widget.*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Baseline security headers for every page (no CSP yet: it needs testing against
# Google Fonts, the chat widget and Netlify Forms before it can be enforced).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# The sitemap is for crawlers, not a page to show in search results.
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    X-Robots-Tag = "noindex"
