<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Arial, Helvetica, sans-serif">
<rect width="800" height="450" rx="14" fill="#f4f7f2"/>
<text x="400" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#1d3b2a">LoRa-Gateway im Feld: Höhe schlägt Leistung</text>
<rect x="0" y="330" width="800" height="120" fill="#cfe3c9"/>
<path d="M430,330 Q520,250 610,330 Z" fill="#a9c79f"/>
<text x="520" y="318" text-anchor="middle" font-size="12" fill="#1d3b2a">Hügel</text>
<g fill="#5b8a52"><circle cx="300" cy="305" r="22"/><circle cx="325" cy="300" r="20"/><rect x="306" y="315" width="8" height="18" fill="#6b4f33"/></g>
<text x="312" y="355" text-anchor="middle" font-size="12" fill="#1d3b2a">Baumreihe</text>
<!-- gateway mast -->
<rect x="118" y="160" width="6" height="170" fill="#4a5f52"/><rect x="104" y="150" width="34" height="22" rx="4" fill="#2f8f5b"/>
<text x="121" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d3b2a">Gateway auf Mast</text>
<g fill="none" stroke="#2f8f5b" stroke-width="2" opacity=".55"><path d="M150,161 A40,40 0 0 1 150,201"/><path d="M165,146 A60,60 0 0 1 165,216"/><path d="M180,131 A80,80 0 0 1 180,231"/></g>
<!-- nodes -->
<g><line x1="121" y1="161" x2="250" y2="318" stroke="#2f8f5b" stroke-width="2" stroke-dasharray="5 5"/><circle cx="250" cy="320" r="9" fill="#2f8f5b"/><text x="250" y="380" text-anchor="middle" font-size="12" fill="#1d3b2a">Knoten 1 ✓</text></g>
<g><line x1="121" y1="161" x2="400" y2="318" stroke="#2f8f5b" stroke-width="2" stroke-dasharray="5 5"/><circle cx="400" cy="320" r="9" fill="#2f8f5b"/><text x="400" y="380" text-anchor="middle" font-size="12" fill="#1d3b2a">Knoten 2 ✓ (über die Bäume)</text></g>
<g><line x1="121" y1="161" x2="470" y2="290" stroke="#c0623f" stroke-width="2" stroke-dasharray="5 5"/><text x="478" y="298" font-size="20" fill="#c0623f" font-weight="bold">✗</text><circle cx="680" cy="320" r="9" fill="#c0623f"/><text x="680" y="380" text-anchor="middle" font-size="12" fill="#1d3b2a">Knoten 3 ✗ (hinter dem Hügel)</text></g>
<rect x="470" y="90" width="300" height="120" rx="10" fill="#fff" stroke="#9fb3a6"/>
<g font-size="13" fill="#1d3b2a"><text x="485" y="115" font-weight="bold">Faustregeln</text>
<text x="485" y="140">• Antenne so hoch und frei wie möglich</text>
<text x="485" y="162">• Sichtlinie zu den Sensoren prüfen</text>
<text x="485" y="184">• Funklöcher: Standort oder 2. Gateway</text></g>
<text x="770" y="438" text-anchor="end" font-size="11" fill="#4a5f52">Schematische Darstellung, nicht maßstabsgetreu</text>
</svg>
